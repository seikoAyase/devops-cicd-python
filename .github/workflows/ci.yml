
name: Python Microservice CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pytest-html

      - name: Run tests and generate reports
        run: |
          mkdir -p test-results

          python -m pytest tests/ -v \
            --cov=app \
            --cov-report=xml:test-results/coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results/junit-report.xml \
            --html=test-results/pytest-report.html \
            --self-contained-html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./test-results/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Generate test summary
        if: always()
        shell: bash
        run: |
          echo "## Python ${{ matrix.python-version }} Test Results" >> "$GITHUB_STEP_SUMMARY"

          if [ -f test-results/junit-report.xml ]; then
            python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results/junit-report.xml").getroot()

          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")

          total = sum(int(s.get("tests", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          passed = total - failed - errors - skipped

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"\n- Total: {total}\n")
              f.write(f"- Passed: {passed}\n")
              f.write(f"- Failed: {failed}\n")
              f.write(f"- Errors: {errors}\n")
              f.write(f"- Skipped: {skipped}\n")
          PY
          else
            echo "Test report not available." >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-build-and-test:
    name: Docker Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t python-microservice-cicd:latest .

      - name: Run unit tests in Docker
        run: |
          docker run --rm \
            python-microservice-cicd:latest \
            python -m pytest tests/ -v

      - name: Verify Docker image
        run: |
          docker image inspect python-microservice-cicd:latest

      - name: Generate Docker summary
        if: success()
        run: |
          echo "## Docker CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests passed inside Docker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image verified" >> "$GITHUB_STEP_SUMMARY"
